name: smartstudio
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - torchvision
  - pytorch-cuda=12.1
  - pip
  - pip:
      - opencv-python
      - PySide6
      - PyYAML
      - scipy
      - numpy
      - ultralytics
      - Flask>=3.0
      - pytest
      - requests
      - faster-whisper>=1.2
      - imageio-ffmpeg>=0.6
      - sounddevice>=0.5
      - PyAudioWPatch>=0.2.12.8; platform_system == "Windows"
